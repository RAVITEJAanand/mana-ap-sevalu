<!DOCTYPE html>
<html lang="te" data-theme="light">
<head>
  <meta name="google-adsense-account" content="ca-pub-2468238593433239">
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="assets/images/mana_logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>అధికారిక లోగో డౌన్‌లోడ్ | మన AP సేవలు</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Google AdSense Official Integration Code -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2468238593433239" crossorigin="anonymous"></script>

</head>
<body style="background: var(--bg-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">

  <div class="container" style="max-width: 600px; text-align: center;">
    
    <!-- Logo Preview Card -->
    <div style="background: var(--bg-card); border: 2px solid var(--border-light); border-radius: var(--radius-xl); padding: 36px 24px; box-shadow: var(--shadow-lg); margin-bottom: 24px;">
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px;">👑 మన AP సేవలు అధికారిక లోగో</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 24px;">
        WhatsApp Profile (DP), Status & Social Media కోసం హై-రిజల్యూషన్ అఫీషియల్ బ్రాండ్ లోగో.
      </p>

      <!-- SVG Container -->
      <div style="max-width: 320px; margin: 0 auto 24px auto; border-radius: 24px; overflow: hidden; box-shadow: 0 16px 32px rgba(2, 83, 115, 0.25);">
        <img src="assets/images/mana_logo.svg" id="logoImg" alt="మన AP సేవలు Logo" style="width: 100%; height: auto; display: block;">
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <button id="downloadPngBtn" class="search-submit-btn" style="padding: 12px 24px; font-size: 1rem; border-radius: var(--radius-md);">
          <span>📥</span>
          <span>PNG ఇమేజ్ డౌన్‌లోడ్ చేయండి</span>
        </button>
        <a href="assets/images/mana_logo.svg" download="mana_ap_sevalu_logo.svg" class="guide-read-btn" style="padding: 12px 20px; font-size: 1rem; border-radius: var(--radius-md);">
          <span>📐</span>
          <span>SVG వెక్టార్ డౌన్‌లోడ్</span>
        </a>
      </div>
    </div>

    <div>
      <a href="index.html" class="nav-link" style="font-weight: 700; font-size: 0.95rem; color: var(--primary);">
        ← హోమ్ పేజీకి తిరిగి వెళ్లండి
      </a>
    </div>

  </div>

  <!-- Canvas for PNG Export -->
  <canvas id="exportCanvas" width="1000" height="1000" style="display: none;"></canvas>

  <script>
    document.getElementById('downloadPngBtn').addEventListener('click', () => {
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      img.onload = () => {
        ctx.clearRect(0, 0, 1000, 1000);
        ctx.drawImage(img, 0, 0, 1000, 1000);
        
        const a = document.createElement('a');
        a.download = 'mana_ap_sevalu_logo.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = '../assets/images/mana_logo.svg';
    });
  </script>

</body>
</html>
