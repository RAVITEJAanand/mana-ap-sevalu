<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f2d"/>
      <stop offset="50%" stop-color="#013449"/>
      <stop offset="100%" stop-color="#025373"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Shield Container -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ring with Dash Pattern -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Inner Navy Disc -->
  <circle cx="250" cy="250" r="185" fill="#012b3c" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Golden Sun Rays / Star of Excellence Motif -->
  <g transform="translate(250, 160)" filter="url(#glow)">
    <!-- 8 Point Golden Crest Star -->
    <path d="M0 -55 L14 -18 L55 -14 L24 16 L32 55 L0 30 L-32 55 L-24 16 L-55 -14 L-14 -18 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="12" fill="#011f2d" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Digital Bridge / Gateway Arch -->
  <path d="M120 280 Q250 210 380 280" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 295 Q250 235 360 295" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Brand Title (English AP) -->
  <text x="250" y="275" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">
    AP
  </text>

  <!-- Brand Title (Telugu Typography) -->
  <text x="250" y="340" font-family="'Noto Sans Telugu', sans-serif" font-size="38" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">
    మన AP సేవలు
  </text>

  <!-- Subtitle Tagline -->
  <text x="250" y="380" font-family="'Noto Sans Telugu', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">
    ఆంధ్రప్రదేశ్ డిజిటల్ పౌర సేవా మిత్ర
  </text>

  <!-- Official Guarantee Seal Dots -->
  <circle cx="100" cy="250" r="6" fill="#f59e0b"/>
  <circle cx="400" cy="250" r="6" fill="#f59e0b"/>
</svg>
